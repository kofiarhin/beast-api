# Beast API (PM2: beast-api on 127.0.0.1:3100) - Linear webhook receiver only.
# HTTP-only bootstrap; `certbot --nginx -d beast-api.devkofi.com` adds the 443/TLS blocks (same as ideahub-api).
server {
    listen 80;
    listen [::]:80;
    server_name beast-api.devkofi.com;

    access_log /var/log/nginx/beast-api.access.log;
    error_log  /var/log/nginx/beast-api.error.log;

    client_max_body_size 2m;   # app accepts webhook bodies up to 1mb

    # Only the Linear webhook is public. /health and /jobs/* stay loopback-only.
    location = /webhooks/linear {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:3100;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    location / {
        return 404;
    }
}
